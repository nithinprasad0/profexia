[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s
# Fallback only: alembic/env.py uses the DATABASE_URL environment variable when set.
sqlalchemy.url = postgresql+asyncpg://profexia:profexia@postgres:5432/profexia

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
