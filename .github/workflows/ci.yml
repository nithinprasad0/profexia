name: CI

# Runs on every push and pull request. Nothing here deploys: Render deploys only
# after these checks pass (render.yaml: autoDeployTrigger: checksPass).
# All values below are CI-only throwaway settings; no repository secrets are used.

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (tests, migrations, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: profexia
          POSTGRES_USER: profexia
          POSTGRES_PASSWORD: profexia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U profexia -d profexia"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://profexia:profexia@localhost:5432/profexia
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: ci-only-jwt-secret-not-used-anywhere-else-0123456789
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python compiles and imports
        run: |
          python -m compileall -q app alembic scripts tests
          python -c "import app.main; print('app imported')"

      # Unit tests + security/integration tests. conftest.py creates and migrates a
      # separate `profexia_test` database and uses Redis db 15.
      - name: Tests (unit + security + multi-instance real-time)
        run: pytest -q

      - name: Migrations - single head
        run: |
          alembic heads
          test "$(alembic heads | wc -l)" -eq 1

      - name: Migrations - upgrade to head twice (idempotent)
        run: |
          alembic upgrade head
          alembic upgrade head
          alembic current | tee /tmp/current.txt
          grep -q "(head)" /tmp/current.txt

      - name: Seed roles
        run: python -m app.infrastructure.seed

      - name: Start API and run end-to-end smoke test
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/health/live && break; sleep 1; done
          python scripts/smoke_test.py http://127.0.0.1:8000 --origin http://localhost:5173

      - name: API log must not contain tokens
        if: always()
        run: |
          cat /tmp/api.log || true
          if grep -E "token=ey|Bearer ey" /tmp/api.log; then echo "Token found in logs" && exit 1; fi

  frontend:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        env:
          VITE_API_URL: https://api.example.com
        run: npm run build

      - name: Production bundle must not reference localhost or duplicate the API prefix
        run: |
          if grep -R -E "localhost:8000|/api/v1/api/v1" dist; then
            echo "Production bundle contains a localhost URL or a duplicated API prefix" && exit 1
          fi
          grep -q "https://api.example.com" dist/assets/*.js

  security:
    name: Security (secrets, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan the full history, not just the latest commit

      - name: Secret scan (gitleaks, full git history)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source /repo --redact --no-banner --exit-code 1

      - name: No committed env files or private keys
        run: |
          bad=$(git ls-files | grep -E '(^|/)\.env(\..+)?$|\.pem$|\.key$' | grep -vE '(^|/)\.env\.example$' || true)
          if [ -n "$bad" ]; then
            echo "Committed secret-bearing file(s):" && echo "$bad" && exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt --progress-spinner off

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Frontend dependency audit (npm audit, high+)
        working-directory: frontend
        run: npm audit --audit-level=high

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t profexia-api:ci .

      - name: Image runs as non-root and excludes secrets/tests
        run: |
          test "$(docker run --rm --entrypoint id profexia-api:ci -u)" != "0"
          docker run --rm --entrypoint sh profexia-api:ci -c 'test ! -e /app/.env && test ! -d /app/tests && test ! -d /app/frontend'

      - name: Validate docker-compose file
        run: docker compose config --quiet
