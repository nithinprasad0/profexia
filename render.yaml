# Render Blueprint for the Profexia FastAPI backend.
# Spec: https://render.com/docs/blueprint-spec
#
# PostgreSQL (Neon) and Redis (Upstash) are external managed services. Render
# prompts once, at Blueprint creation, for every env var marked `sync: false`.
# Optional provider credentials (Razorpay, Judge0, LiveKit) are added later in
# the service's Environment tab; see docs/DEPLOYMENT.md section 7.
services:
  - type: web
    name: profexia-api
    runtime: docker
    # Backend lives at the repository root; the frontend (./frontend) is on Vercel.
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Cannot be changed after creation. Keep it close to your Neon/Upstash region.
    region: singapore
    # "free" sleeps after ~15 minutes idle (cold starts, dropped WebSockets).
    # Use a paid instance type for a real production service.
    plan: free
    healthCheckPath: /health/live
    # Deploy only after GitHub checks (CI) pass for the pushed commit.
    autoDeployTrigger: checksPass
    # Start command = Dockerfile ENTRYPOINT (docker-entrypoint.sh):
    # `alembic upgrade head` -> idempotent role seed -> uvicorn on 0.0.0.0:$PORT.
    envVars:
      # --- Required secrets (prompted at Blueprint creation) -------------------
      - key: DATABASE_URL
        sync: false # Neon connection string, e.g. postgresql://…neon.tech/neondb?sslmode=require
      - key: REDIS_URL
        sync: false # Upstash TLS URL: rediss://default:<password>@<host>.upstash.io:6379
      - key: CORS_ORIGINS
        sync: false # exact frontend origin(s), e.g. https://profexia.vercel.app
      - key: JWT_SECRET_KEY
        generateValue: true # random 256-bit value generated by Render

      # --- Non-secret production settings --------------------------------------
      - key: ENVIRONMENT
        value: production
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "true"
      # Client IP for per-IP rate limits. Render's edge is Cloudflare, so the
      # rightmost X-Forwarded-For entry may be a Cloudflare address. MEASURE with
      # the PROXY_DIAGNOSTICS endpoint and set TRUSTED_PROXY_COUNT and/or
      # CLIENT_IP_HEADER in the dashboard (docs/DEPLOYMENT.md, "Rate limiting and client IPs").
      - key: TRUSTED_PROXY_COUNT
        value: "1"
      # Redis pub/sub fan-out so WebSockets work across multiple instances.
      - key: REALTIME_BACKEND
        value: redis
      - key: RAZORPAY_BASE_URL
        value: https://api.razorpay.com/v1
      - key: JUDGE0_AUTH_HEADER
        value: X-RapidAPI-Key
      - key: JUDGE0_WAIT
        value: "true"
